name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
 
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
 
      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew build 2>&1 | tee build-output.log
          exit ${PIPESTATUS[0]}
 
